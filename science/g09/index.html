<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 9 Science · MYP 4</title>
<style>
:root{--navy:#1F3A5F;--accent:#E65100;--ink:#263238;--muted:#606A72;--bg:#F2F5F9;--line:#DDE6F0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Calibri,"Helvetica Neue",Arial,sans-serif}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--accent);padding:18px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:1.5rem}
header p{margin:4px 0 0;opacity:.85}
header a{color:#fff}
.credit{text-align:right;font-size:.85rem;line-height:1.35;opacity:.92}
@media (max-width:600px){.credit{text-align:left}}
main{max-width:1100px;margin:0 auto;padding:20px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.block{grid-column:1/-1;margin:18px 0 0;padding:10px 14px;background:var(--navy);color:#fff;border-radius:10px;font-size:1.25rem;
  border-bottom:4px solid var(--accent)}
.block:first-child{margin-top:0}
.block.subj{background:#fff;color:var(--sc);border:1px solid var(--line);border-left:6px solid var(--sc);border-bottom:1px solid var(--line)}
.lead{grid-column:1/-1;margin:0;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;
  border-left:5px solid var(--sc,var(--navy))}
.card h2{margin:0 0 4px;color:var(--navy);font-size:1.2rem}
.card p{margin:4px 0 0}
.tag{display:inline-block;font-size:.8rem;font-weight:700;color:var(--sc,var(--accent));text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted);font-size:.92rem}
.soon{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:999px;background:#EEF2F6;color:var(--muted);font-size:.85rem;font-weight:600;align-self:flex-start}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:12px}
a.btn{display:inline-block;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:600;min-height:44px}
a.primary{background:var(--accent);color:#fff}
a.card-link{text-decoration:none;color:inherit}
a.card-link:hover .card,a.card-link:focus .card{border-color:var(--accent);box-shadow:0 2px 10px rgba(31,58,95,.12)}
a.card-link .card{height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:999px;color:#fff;background:var(--c)}
footer{max-width:1100px;margin:0 auto;padding:4px 16px 28px;color:var(--muted);font-size:.85rem}
@media (max-width:759px){header{padding:12px 16px}header h1{font-size:1.25rem}main{grid-template-columns:1fr;padding:14px 16px}}
/* icons (22 Oct 2026): same line style as the DP page */
.block,.card h2{display:flex;align-items:center;gap:10px}
.ic{flex:none;width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card .ic{color:var(--sc,var(--navy))}
.block .ic{width:28px;height:28px}
/* ---- subject accordion (24 Oct 2026, same as the DP theme accordion): one bar per subject, a line per unit with 4 kind buttons, cards open under the line ---- */
[hidden]{display:none!important}
.start-hint{max-width:1100px;margin:16px auto 0;padding:0 16px;color:var(--muted);font-size:1rem}
.subjects{max-width:1100px;margin:8px auto 0;padding:0 16px;display:grid;gap:10px}
.th-h{margin:0;font-size:1rem}
.th-bar{width:100%;display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 16px 8px 9px;border:2px solid var(--tc);border-radius:11px;
  background:var(--tc);color:#fff;font:inherit;text-align:left;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.th-bar:hover{filter:brightness(1.06)}
.th-bar:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.th.open .th-bar{border-radius:11px 11px 0 0;box-shadow:none}
.th-bar .L{flex:none;width:40px;height:40px;border-radius:8px;background:#fff;color:var(--tc);display:grid;place-items:center}
.th-bar .L .ic{width:28px;height:28px}
.th-bar .tx{flex:1;min-width:0;display:flex;align-items:center;gap:4px 14px}
.th-bar .tn{flex:1;min-width:0;font-weight:700;font-size:1.1rem;line-height:1.25}
.th-bar .sum{flex:none;font-size:.88rem;font-weight:600;opacity:.92;white-space:nowrap}
.th-bar .car{flex:none;width:16px;text-align:center}
.th-body{background:color-mix(in srgb,var(--tc) 6%,#fff);border:2px solid var(--tc);border-top:0;border-radius:0 0 11px 11px;padding:2px 12px 6px}
.st + .st{border-top:1px solid color-mix(in srgb,var(--tc) 22%,#fff)}
.st-line{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 14px;padding:8px 0}
.st-name{margin:0;display:flex;align-items:center;gap:8px;min-width:0;font-size:1rem;line-height:1.25;color:var(--ink)}
.st-name .code{flex:none;min-width:38px;text-align:center;font-weight:800;font-size:.88rem;color:#fff;background:var(--tc);border-radius:5px;padding:2px 6px}
.st-name .nm{font-weight:700}
.kbs{display:grid;grid-template-columns:repeat(3,9.6rem);gap:8px}
.kb{display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px;padding:6px 8px;border:2px solid var(--tc);border-radius:9px;
  background:#fff;color:var(--tc);font-weight:700;font-size:.88rem;line-height:1.15;text-decoration:none;white-space:nowrap}
.kb.k-sim{background:var(--tc);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.18)}
a.kb:hover,a.kb.on{background:color-mix(in srgb,var(--tc) 12%,#fff)}
a.kb.k-sim:hover,a.kb.k-sim.on{background:var(--tc);filter:brightness(1.1)}
a.kb.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--tc)}
a.kb:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.kb.soon{border:2px solid #D5DADF;background:#F3F5F7;color:#9AA3AA;box-shadow:none;cursor:default}
.kb.soon .ks{display:none}
.kb.soon .sn::before{content:"· "}
.st.open > .st-line{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--tc) 6%,#fff);box-shadow:0 7px 8px -7px rgba(0,0,0,.3)}
.st-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:6px 0 16px}
@media (max-width:1099px){
  .st-line{grid-template-columns:1fr}
  .kbs{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1023px){
  .th-bar .tx{flex-direction:column;align-items:flex-start}
  .th-bar .tn{flex:none}
}
@media (max-width:759px){
  .start-hint{margin-top:10px;font-size:.92rem}
  .subjects{gap:8px}
  .th-bar{min-height:60px;gap:10px;padding:7px 12px 7px 7px}
  .th-bar .sum{display:none}
  .th-bar .tn{font-size:1rem}
  .th-body{padding:0 8px 4px}
  .st-line{gap:6px}
  .kbs{gap:6px}
  .kb{flex-direction:column;gap:1px;min-height:50px;padding:4px 2px;font-size:.92rem}
  .kb .kw{font-size:0;line-height:1}
  .kb .kw::after{content:attr(data-short);font-size:.72rem;font-weight:600}
  .kb.soon .sn{order:-1;font-size:.72rem}
  .kb.soon .sn::before{content:""}
  .st-panel{grid-template-columns:1fr;gap:10px}
}
.totop{display:none}
@media (max-width:759px){
  .totop{position:fixed;right:14px;bottom:14px;z-index:15;display:none;align-items:center;gap:6px;min-height:46px;padding:8px 16px;
    border:0;border-radius:23px;background:var(--navy);color:#fff;font:inherit;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer}
  .totop.on{display:flex}
}
/* ---- end subject accordion ---- */
</style>
</head>

<svg id="icons" width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="ic-electricity" viewBox="0 0 24 24"><path d="M10 5H3v14h6.8M14 5h7v14h-6.8"/><path d="M10 2.5v5M14 3.8v2.4"/><circle cx="12" cy="19" r="2.2"/><path d="M10.5 17.5l3 3M13.5 17.5l-3 3"/></symbol><symbol id="ic-measure" viewBox="0 0 24 24"><rect x="2" y="13.5" width="20" height="6.5" rx="1"/><path d="M5 13.5v2.6M8 13.5v1.6M11 13.5v2.6M14 13.5v1.6M17 13.5v2.6M20 13.5v1.6" stroke-width="1.2"/><path d="M7 7h10M7 4.8v4.4M17 4.8v4.4"/><circle cx="12" cy="7" r="1.5" fill="currentColor"/></symbol><symbol id="ic-nuclear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M13.5 9.4L16.5 4.2A9 9 0 0 0 7.5 4.2L10.5 9.4A3 3 0 0 1 13.5 9.4z"/><path d="M13.5 9.4L16.5 4.2A9 9 0 0 0 7.5 4.2L10.5 9.4A3 3 0 0 1 13.5 9.4z" transform="rotate(120 12 12)"/><path d="M13.5 9.4L16.5 4.2A9 9 0 0 0 7.5 4.2L10.5 9.4A3 3 0 0 1 13.5 9.4z" transform="rotate(240 12 12)"/></symbol><symbol id="ic-physics" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.7" fill="currentColor"/><ellipse cx="12" cy="12" rx="10" ry="3.8"/><ellipse cx="12" cy="12" rx="10" ry="3.8" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="3.8" transform="rotate(-60 12 12)"/></symbol></svg>

  </div>

<p class="start-hint">Choose simulations, study guides or test yourself for a unit.</p>
<div class="subjects" id="subjects"></div>
<!-- ---- end subject accordion ---- -->

</main>
<footer>Works in any modern browser on laptops, Chromebooks, tablets and phones.</footer>
<script>/* ---- subject accordion (JS, 24 Oct 2026, adapted from the DP theme accordion): one bar per subject; unit lines with 3 kind buttons; the cards from <main> open under the line ---- */
(function(){
  // [key, name, colour, icon, [[unit, title], …]] in teaching order; CURRENT = the subject open on arrival
  const SUBJECTS = [["physics", "Physics", "#2055A3", "ic-physics", [["1", "Measurements and uncertainty"], ["2", "Nuclear physics"], ["3", "Electricity"]]]];
  const CURRENT = "physics";
  // kind, label, label for 1, short label (phones), sign, hash suffix, summary words (1, more)
  // order and names (teacher, 26 Oct 2026): Simulations · Study guides · Test yourself (was "Quizzes"; Worksheets removed)
  const KINDS = [["sim", "Simulations", "Simulation", "Sims", "▶", "-sims", "simulation", "simulations"],
                 ["guide", "Study guides", "Study guide", "Guides", "📘", "-guides", "study guide", "study guides"],
                 ["quiz", "Test yourself", "Test yourself", "Test yourself", "✔", "-quizzes", "test", "tests"]];
  const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const hk = u => u === "S" ? "skills" : "u" + u;   // hash name of a unit line
  const main = document.querySelector("main"), box = document.getElementById("subjects");
  // cards: kind and unit from the tag text ("Simulation · Unit 1", "Study guide · Science skills"), so new cards need no extra attributes
  const cards = [...main.querySelectorAll(".card")];
  cards.forEach(c => { const t = ((c.querySelector(".tag") || {}).textContent || "").toLowerCase(); let m;
    if (!c.dataset.kind) c.dataset.kind = /^(quiz|test yourself)/.test(t) ? "quiz" : /^study guide/.test(t) ? "guide" : "sim";
    if (!c.dataset.unit) c.dataset.unit = /science skills/.test(t) ? "S" : (m = t.match(/unit (\d+)/)) ? m[1] : ""; });
  const of = (kind, u) => cards.filter(c => c.dataset.kind === kind && c.dataset.unit === u);
  const SUBJ = {}; SUBJECTS.forEach(([key, name, col, icon, units]) => units.forEach(([u]) => SUBJ[u] = key));
  const many = (n, one, more) => n + " " + (n === 1 ? one : more);

  // ---------- build: subject bars, unit lines, empty panels ----------
  let h = "";
  SUBJECTS.forEach(([key, name, col, icon, units]) => {
    const sum = [];
    KINDS.forEach(([kind, , , , , , w1, wn]) => { const n = units.reduce((a, [u]) => a + of(kind, u).length, 0); if (n) sum.push(many(n, w1, wn)); });
    h += '<section class="th" id="th-' + key + '" style="--tc:' + col + '"><h2 class="th-h"><button type="button" class="th-bar" id="thb-' + key +
      '" aria-expanded="false" aria-controls="thp-' + key + '"><span class="L"><svg class="ic" aria-hidden="true"><use href="#' + icon + '"/></svg></span><span class="tx"><span class="tn">' +
      esc(name) + '</span><span class="sum">' + (sum.length ? sum.join(" · ") : "coming soon") +
      '</span></span><span class="car" aria-hidden="true">▾</span></button></h2><div class="th-body" id="thp-' + key + '" role="region" aria-labelledby="thb-' + key + '" hidden>';
    units.forEach(([u, title]) => {
      let btns = "", panels = "";
      KINDS.forEach(([kind, lab, one, short, sign, suf]) => {
        const c = of(kind, u).length;
        if (c){
          btns += '<a class="kb k-' + kind + '" href="#' + hk(u) + suf + '" data-kind="' + kind + '" aria-controls="sp-' + u + '-' + kind + '" aria-expanded="false"><span class="ks">' +
            sign + " " + c + '</span> <span class="kw" data-short="' + short + '">' + (c === 1 ? one : lab) + '</span></a>';
          panels += '<div class="st-panel" id="sp-' + u + '-' + kind + '" role="region" aria-label="' + esc(title) + " — " + lab.toLowerCase() + '" hidden></div>';
        } else btns += '<span class="kb k-' + kind + ' soon" aria-disabled="true"><span class="ks">' + sign + '</span> <span class="kw" data-short="' + short + '">' + lab + '</span><span class="sn">soon</span></span>';
      });
      h += '<div class="st" id="st-' + u + '" data-unit="' + u + '"><div class="st-line"><h3 class="st-name"><span class="code">' + (u === "S" ? "S" : "Unit " + u) + '</span><span class="nm">' +
        esc(title) + '</span></h3><div class="kbs" role="group" aria-label="' + esc(title) + '">' + btns + '</div></div>' + panels + '</div>';
    });
    h += '</div></section>';
  });
  box.innerHTML = h;
  cards.forEach(c => { const p = document.getElementById("sp-" + c.dataset.unit + "-" + c.dataset.kind); if (p) p.appendChild(c); });
  main.hidden = true;

  // ---------- state: one subject open, at most one panel; the hash names it ----------
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let S = {subj: null, unit: null, kind: null};
  function parse(hash){   // #chemistry · #u1 · #u1-sims · #u1-guides · #u1-quizzes (Test yourself) · #skills… (old #u1-worksheets: the unit's subject)
    const raw = decodeURIComponent((hash || "").replace(/^#/, "")); let m;
    if ((m = raw.match(/^(?:u(\d+)|(skills))(?:-(sims|quizzes|worksheets|guides))?$/))){
      const u = m[1] || "S", kind = m[3] ? (KINDS.find(x => x[5] === "-" + m[3]) || [null])[0] : null;
      if (SUBJ[u]) return {subj: SUBJ[u], unit: kind && document.getElementById("sp-" + u + "-" + kind) ? u : null, kind: kind && document.getElementById("sp-" + u + "-" + kind) ? kind : null};
    }
    if (document.getElementById("th-" + raw)) return {subj: raw, unit: null, kind: null};
    return {subj: CURRENT, unit: null, kind: null};   // start: the subject taught now is open
  }
  const url = s => location.pathname + location.search + (s.kind ? "#" + hk(s.unit) + KINDS.find(x => x[0] === s.kind)[5] : s.subj ? "#" + s.subj : "");
  // open panel: a long one brings its line to the top (it then sticks); a short one scrolls only as far as needed to be fully visible
  function reveal(el, open){ const r = el.getBoundingClientRect(), H = innerHeight; let dy = 0;
    if (r.top < 0 || (open && r.height > H - 12)) dy = r.top - 6;
    else if (open && r.bottom > H) dy = Math.min(r.bottom - H + 8, r.top - 6);
    else if (r.top > H - 80) dy = r.top - 6;
    if (Math.abs(dy) > 1) window.scrollBy({top: dy, behavior: reduce ? "auto" : "smooth"}); }
  function render(s, target, open){
    S = s;
    box.querySelectorAll(".th").forEach(t => { const on = t.id === "th-" + s.subj, b = t.querySelector(".th-bar");
      t.classList.toggle("open", on); b.setAttribute("aria-expanded", String(on)); b.querySelector(".car").textContent = on ? "▴" : "▾"; t.querySelector(".th-body").hidden = !on; });
    box.querySelectorAll(".st").forEach(st => st.classList.toggle("open", !!s.kind && st.dataset.unit === s.unit));
    box.querySelectorAll(".st-panel").forEach(p => p.hidden = !(s.kind && p.id === "sp-" + s.unit + "-" + s.kind));
    box.querySelectorAll("a.kb").forEach(a => { const on = !!s.kind && a.dataset.kind === s.kind && a.closest(".st").dataset.unit === s.unit;
      a.classList.toggle("on", on); a.setAttribute("aria-expanded", String(on)); });
    if (target) reveal(target, open);
  }
  function go(s, target, open){ history.pushState(s, "", url(s)); render(s, target, open); }
  box.querySelectorAll(".th-bar").forEach(b => b.addEventListener("click", () => { const key = b.id.slice(4);
    go(S.subj === key ? {subj: null, unit: null, kind: null} : {subj: key, unit: null, kind: null}, b); }));
  box.addEventListener("click", e => { const a = e.target.closest("a.kb"); if (!a) return; e.preventDefault();
    const st = a.closest(".st"), u = st.dataset.unit, kind = a.dataset.kind;
    if (S.unit === u && S.kind === kind) go({subj: SUBJ[u], unit: null, kind: null}, st);   // the open button again: close
    else go({subj: SUBJ[u], unit: u, kind}, st, true); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && S.kind){ const st = document.getElementById("st-" + S.unit);
    go({subj: S.subj, unit: null, kind: null}, st); const a = st.querySelector("a.kb"); if (a) a.focus(); } });
  const fromState = st => st && "subj" in st ? st : parse(location.hash);
  window.addEventListener("popstate", e => { const s = fromState(e.state);
    render(s, s.unit ? document.getElementById("st-" + s.unit) : s.subj ? document.getElementById("thb-" + s.subj) : null, !!s.kind); });
  const s0 = parse(location.hash); history.replaceState(s0, "", location.href);
  render(s0, s0.unit ? document.getElementById("st-" + s0.unit) : null, !!s0.kind);
  if (s0.unit) window.addEventListener("load", () => setTimeout(() => render(S, document.getElementById("st-" + S.unit), !!S.kind), 60));
})();
</script>
<button class="totop" id="totop" type="button" aria-label="Back to the subjects">↑ Subjects</button>
<script>
// phones: "↑ Subjects" appears once the first subject bar has scrolled out of view, and scrolls back to the subjects
(function(){ const b = document.getElementById("totop"), box = document.getElementById("subjects");
  const upd = () => b.classList.toggle("on", box.getBoundingClientRect().top < -60);
  window.addEventListener("scroll", upd, {passive: true}); window.addEventListener("resize", upd); upd();
  b.addEventListener("click", () => box.scrollIntoView({behavior: "smooth", block: "start"}));
})();
</script>
